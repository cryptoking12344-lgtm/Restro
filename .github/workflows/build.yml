name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack the signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.RESTRO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/restro.jks"
            echo "RESTRO_KEYSTORE=$RUNNER_TEMP/restro.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Restro key"
          else
            echo "::warning::No RESTRO_KEYSTORE_B64 secret yet - this APK uses a random key (uninstall needed to update)"
          fi

      - name: Build the APK
        shell: bash
        env:
          RESTRO_KEY_PASS: ${{ secrets.RESTRO_KEY_PASS }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed. Errors:"
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED|Exception" build.log | head -60 || true
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Restro.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Restro-apk
          path: Restro.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Restro build ${{ github.run_number }}
          files: Restro.apk


  # Launches the APK on an Android emulator, taps through the main screens,
  # saves screenshots and reports any crash. Never blocks the APK release.
  uitest:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Restro-apk

      - name: Get test photos
        run: |
          mkdir -p testphotos
          curl -sSLf -o testphotos/oldphoto.jpg https://raw.githubusercontent.com/TencentARC/GFPGAN/master/inputs/whole_imgs/00.jpg
          curl -sSLf -o testphotos/family.png https://raw.githubusercontent.com/TencentARC/GFPGAN/master/inputs/whole_imgs/10045.png
          ls -la testphotos

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/ui-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test
          path: |
            shots/
            logcat.txt
            crashes.txt
            restored/

      - name: Save screenshots to the ui-shots branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp -r shots logcat.txt crashes.txt restored/ /tmp/out/ 2>/dev/null || true
          git config user.name "restro-ci"
          git config user.email "restro-ci@users.noreply.github.com"
          git checkout -q --orphan ui-shots-tmp
          git rm -rfq . > /dev/null
          rm -rf testphotos Restro.apk
          cp -r /tmp/out/* .
          git add -A
          git commit -qm "UI screenshots for ${{ github.sha }}"
          git push -qf origin HEAD:ui-shots

      - name: Report crashes on the commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "UI test: $(ls shots 2>/dev/null | wc -l) screenshots"
            echo '```'
            head -80 crashes.txt 2>/dev/null || echo "no crash file"
            echo '```'
          } > ui.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@ui.md
